[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-code-review-agent"
version = "0.1.0"
description = "Multi-agent pull request reviewer built on Claude tool calling, LangGraph and a custom MCP server."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vivek Kumar" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.11"]

[project.scripts]
review-agent = "review_agent.cli:main"
review-agent-mcp = "review_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/review_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"
